<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font: 700 32px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #64748b; }
      .node { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .server { fill: #dbeafe; stroke: #3b82f6; }
      .gameplay { fill: #dcfce7; stroke: #22c55e; }
      .pool { fill: #fef3c7; stroke: #f59e0b; }
      .ai { fill: #f3e8ff; stroke: #a855f7; }
      .label { font: 600 18px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #1e293b; text-anchor: middle; dominant-baseline: middle; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-label { font: 500 15px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1600" height="1080" fill="#ffffff"/>
  <text x="70" y="70" class="title">After Blackout · 系统架构</text>
  <text x="70" y="102" class="subtitle">服务器权威、对象池与数据驱动刷怪的模块关系</text>

  <!-- edges -->
  <path class="edge" d="M230 190 H300"/>
  <path class="edge" d="M470 190 H540"/>
  <text class="edge-label" x="485" y="178">Server RPC</text>
  <path class="edge" d="M710 190 H780"/>
  <path class="edge" d="M710 220 H1030 V190 H1060"/>
  <path class="edge" d="M385 230 V330"/>
  <path class="edge" d="M470 380 H540"/>
  <path class="edge" d="M710 380 H780"/>
  <text class="edge-label" x="725" y="365">Server damage</text>
  <path class="edge" d="M625 230 V510"/>
  <path class="edge" d="M230 585 H540"/>
  <text class="edge-label" x="335" y="568">Spawn Event Tag</text>
  <path class="edge" d="M710 585 H830"/>
  <text class="edge-label" x="750" y="568">DataAsset</text>
  <path class="edge" d="M710 620 H1120 V585 H1160"/>
  <text class="edge-label" x="900" y="650">Acquire / Release</text>
  <path class="edge" d="M710 550 H780 V380"/>
  <path class="edge" d="M950 380 H1250"/>
  <path class="edge" d="M870 230 V300"/>
  <path class="edge" d="M870 120 V95 H150 V140"/>
  <path class="edge" d="M1140 120 V95 H150 V140"/>

  <!-- nodes -->
  <g filter="url(#shadow)">
    <rect class="node" x="70" y="140" width="160" height="90" rx="12"/>
    <rect class="server" x="300" y="140" width="170" height="90" rx="12"/>
    <rect class="server" x="540" y="140" width="170" height="90" rx="12"/>
    <rect class="server" x="780" y="140" width="170" height="90" rx="12"/>
    <rect class="server" x="1060" y="140" width="170" height="90" rx="12"/>
    <rect class="gameplay" x="300" y="330" width="170" height="90" rx="12"/>
    <rect class="gameplay" x="540" y="330" width="170" height="90" rx="12"/>
    <rect class="gameplay" x="780" y="330" width="170" height="90" rx="12"/>
    <rect class="ai" x="1030" y="330" width="220" height="90" rx="12"/>
    <rect class="node" x="70" y="540" width="160" height="90" rx="12"/>
    <rect class="server" x="540" y="540" width="170" height="90" rx="12"/>
    <rect class="gameplay" x="830" y="540" width="220" height="90" rx="12"/>
    <rect class="pool" x="1160" y="540" width="270" height="90" rx="12"/>
  </g>
  <text class="label" x="150" y="185">Widget / HUD</text>
  <text class="label" x="385" y="185">ZombiePlayerController</text>
  <text class="label" x="625" y="185">ZombieGameMode</text>
  <text class="label" x="865" y="185">ZombieGameState</text>
  <text class="label" x="1145" y="185">ZombiePlayerState</text>
  <text class="label" x="385" y="375">BP_PlayerCharacter</text>
  <text class="label" x="625" y="375">BP_Rifle</text>
  <text class="label" x="865" y="375">BP_ZombieCharacter</text>
  <text class="label" x="1140" y="375">AIController / Behavior Tree</text>
  <text class="label" x="150" y="585">GeneratorInteractable</text>
  <text class="label" x="625" y="585">AZombieManager</text>
  <text class="label" x="940" y="585">Spawn Event / Zombie Data</text>
  <text class="label" x="1295" y="575">AvailablePool /</text>
  <text class="label" x="1295" y="600">ActiveZombies</text>
</svg>
